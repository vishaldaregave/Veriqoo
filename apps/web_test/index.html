<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inspection Pipeline Tester</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-container">
        <header class="app-header">
            <h1>Test Pipeline</h1>
        </header>
        
        <main class="app-content">
            <div id="status-card" class="card">
                <h3>Pipeline Status</h3>
                <p id="status-text">Not started</p>
            </div>

            <div class="card" id="step-1">
                <h3>1. Create Inspection</h3>
                <button id="btn-create">Create Inspection Session</button>
                <p class="meta" id="meta-inspection-id"></p>
            </div>

            <div class="card disabled" id="step-2">
                <h3>2. Upload Image</h3>
                <input type="file" id="file-upload" accept="image/*" disabled>
                <button id="btn-upload" disabled>Upload Image</button>
                <p class="meta" id="meta-image-id"></p>
            </div>

            <div class="card disabled" id="step-3">
                <h3>3. Run Pipeline</h3>
                <button id="btn-run" disabled>Start Inspection</button>
            </div>

            <div class="card disabled" id="step-4">
                <h3>4. Results</h3>
                <button id="btn-results" disabled>Fetch Report</button>
                <div id="results-content" class="results-container"></div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
